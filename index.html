<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4b9;
            margin: 0;
        }

        header {
            background: #FF8570;
            color: rgba(255, 255, 255, 0);
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #000000;
            padding: 10px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.709);
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.586);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }

        button {
            background: #6f6f6f2f;
            color: white;
            border: white;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #FF8570;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            padding: 15px;
            background: #222;
            color: rgba(255, 255, 255, 0.577);
        }
    </style>
</head>
<body>

<header>
    <h1> BYTEBOX </h1>
    <p> No Ads, No Cost, Full Privacy </p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Welcome!</h2>
    <p> Sorry, still under construction.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="output"></p>
</div>

<footer>
    © 2026 Test Website
</footer>

<script>
function showMessage() {
    document.getElementById("output").textContent =
        "Button clicked successfully!";
}
</script>

</body>
</html>
