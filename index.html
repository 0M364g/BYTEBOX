<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBox - Your digital toolbox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #212121;
            margin: 0;
        }

        header {
            background: #d74000;
            color: #212121;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #212121;
            padding: 10px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: #000000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(83, 83, 83);
        }

        button {
            background: #323131;
            color: #d74000;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #d74000;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            padding: 15px;
            background: #f4f4f4;
            color: #333;
        }
    </style>
</head>
<body>

<header>
    <h1>Test</h1>

</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Welcome!</h2>
    <p>This is still under construction.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="output"></p>
</div>

<footer>
    © 2026 Test Website
</footer>

<script>
function showMessage() {
    document.getElementById("output").textContent =
        "Button clicked successfully!";
}
</script>

</body>
</html>
